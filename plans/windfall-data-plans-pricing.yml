note: >-
  Windfall publishes no pricing page and no self-serve plans for the enrichment API.
  https://www.windfall.com/pricing returns 404 and no pricing URL appears anywhere in
  https://www.windfall.com/sitemap.xml — the site's commercial call to action is "request a
  demo". API access is not sold as a standalone product: Windfall states that existing
  customers get the API "at no additional cost, with a set number of monthly credits" scaled
  to their existing subscription, and that "we won't be charging for a standard set of
  monthly API calls. You can use those as part of your engagement with Windfall, and
  overages will be handled under your existing agreement at a per-additional-API-call cost."
  The credit allocation and refresh cadence are contractual, set by the purchase order, and
  raised by contacting a Windfall account representative. plan_count is 0 because there are
  genuinely no published tiers — this is a recorded absence, not an unchecked field.
