aid: windfall-data
name: Windfall Data
description: >-
  Windfall (windfall.com, formerly windfalldata.com) is a people-intelligence and AI platform
  that personalizes go-to-market workflows with wealth and career data. Its developer-facing
  Windfall API delivers enriched household and career data on a single-record basis in real
  time: submit a person record with basic PII and receive that individual's household net
  worth, a stable Windfall ID, and career signals such as a LinkedIn URL and title, returned
  as JSON in one sub-second request. Coverage is United States, data is refreshed weekly, and
  the API is used for real-time lead routing and grading, marketing enrichment, and analytics
  scoring. Authentication is a Windfall-issued header token with a dedicated sandbox
  environment of deterministic test personas. Windfall is SOC 2 Type 2 certified.
