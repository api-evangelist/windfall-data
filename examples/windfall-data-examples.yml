    language: python
    source: https://api-docs.windfall.com/examples/
    description: >-
      Sequential single-record calls with a 0.2-second delay between requests, and a 1-second
      sleep-and-retry on HTTP 429 — the provider's own pacing pattern against the 5 req/s cap.
  - name: error-handling
    language: javascript
    source: https://api-docs.windfall.com/examples/
