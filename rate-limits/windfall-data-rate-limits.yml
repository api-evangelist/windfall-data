retry_guidance:
  documented: true
  pattern: >-
    The published batch example paces sequential calls with a 0.2-second delay and, on a 429,
    sleeps 1 second before retrying the same record.
  source: https://api-docs.windfall.com/examples/
raising_limits:
  method: contact account representative
  quote: "Contact your Windfall account representative to discuss adjusting your plan."
  source: https://api-docs.windfall.com/examples/
